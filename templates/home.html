<section class="hero">
  <div class="hero-txt">
    <span class="kicker">{{kicker}}</span>
    <h1>{{hero_title}}</h1>
    <p>{{hero_text}}</p>
    <div class="cta"><a class="btn" href="/menu/">Menüyü Gör</a><a class="btn ghost" href="/rezervasyon/">Rezervasyon Yap</a></div>
    {{open}}
  </div>
  <div class="hero-art">{{hero_media}}</div>
</section>
<section class="feats">{{features}}</section>
<section class="blk">
  <h2 class="st">Öne Çıkanlar</h2>
  <div class="grid">{{popular}}</div>
</section>
<section class="blk about">
  <div>{{about_media}}</div>
  <div><h2 class="st">{{about_title}}</h2>{{about_text}}</div>
</section>
<section class="blk">
  <h2 class="st">Misafirlerimiz Ne Diyor?</h2>
  <div class="revs">{{reviews}}</div>
</section>
<section class="blk visit">
  <div><h2 class="st">Bizi Ziyaret Edin</h2><p>{{address}}</p><ul class="hours">{{hours}}</ul></div>
  <iframe title="Harita" src="{{map}}" loading="lazy" allowfullscreen></iframe>
</section>
<section class="blk">
  <h2 class="st">Galeri</h2>
  <div class="gal">{{gallery}}</div>
</section>
