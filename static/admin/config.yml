backend:
  name: github
  repo: baturbaturcan-jpg/site2   # GitHub deponuzun adı farklıysa burayı değiştirin
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

locale: tr
media_folder: static/uploads
public_folder: /uploads

collections:
  - name: settings
    label: Site Ayarları
    files:
      - name: general
        label: Genel Ayarlar
        file: content/settings.json
        format: json
        fields:
          - { label: Dükkan Adı, name: site_title, widget: string }
          - { label: Slogan, name: tagline, widget: string }
          - { label: Logo Simgesi (emoji), name: logo_icon, widget: string, required: false, hint: "Logo resmi yüklemezseniz bu emoji görünür" }
          - { label: Logo Resmi (isteğe bağlı), name: logo_image, widget: image, required: false, hint: "Yüklenirse emojinin yerine geçer" }
          - { label: Üst Bölüm Rengi, name: header_color, widget: color, default: "#dfcfb4" }
          - { label: Duyuru Bandı Açık, name: announce_on, widget: boolean, default: false }
          - { label: Duyuru Metni, name: announce_text, widget: string, required: false }
          - { label: Duyuru Bağlantısı, name: announce_url, widget: string, required: false }
          - { label: Üst Küçük Yazı, name: kicker, widget: string }
          - { label: Ana Başlık, name: hero_title, widget: string }
          - { label: Ana Açıklama, name: hero_text, widget: text }
          - { label: Ana Görsel, name: hero_image, widget: image, required: false }
          - { label: Hakkımızda Başlığı, name: about_title, widget: string }
          - { label: Hakkımızda Metni, name: about_text, widget: text }
          - { label: Hakkımızda Görseli, name: about_image, widget: image, required: false }
          - { label: Adres, name: address, widget: string }
          - { label: Harita Araması, name: map_query, widget: string, hint: "Haritada işaretlenecek adres" }
          - { label: Telefon, name: phone, widget: string }
          - { label: WhatsApp Numarası, name: whatsapp, widget: string, hint: "Ülke koduyla, örn. 905321234567" }
          - { label: E-posta, name: email, widget: string }
          - { label: Instagram Bağlantısı, name: instagram, widget: string, required: false }
          - { label: Alt Bilgi Metni, name: footer_text, widget: string }
          - label: Çalışma Saatleri (Pazartesiden Pazara 7 satır)
            name: hours
            widget: list
            fields:
              - { label: Gün, name: day, widget: string }
              - { label: Açılış, name: open, widget: string, hint: "Örn. 08:00" }
              - { label: Kapanış, name: close, widget: string, hint: "Örn. 23:00" }
              - { label: O gün kapalı, name: closed, widget: boolean, default: false }
          - label: Galeri
            name: gallery
            widget: list
            required: false
            fields:
              - { label: Görsel, name: image, widget: image, required: false }
              - { label: Açıklama, name: caption, widget: string }
          - label: Mekân Fotoğrafları (iletişim sayfası)
            name: venue
            widget: list
            required: false
            fields:
              - { label: Görsel, name: image, widget: image, required: false }
              - { label: Açıklama, name: caption, widget: string }
          - label: Özellik Kutuları (ana sayfa)
            name: features
            widget: list
            required: false
            fields:
              - { label: Simge (emoji), name: icon, widget: string, required: false }
              - { label: Simge Resmi (isteğe bağlı, emojinin yerine geçer), name: image, widget: image, required: false }
              - { label: Başlık, name: title, widget: string }
              - { label: Metin, name: text, widget: string }
          - label: Misafir Yorumları
            name: reviews
            widget: list
            required: false
            fields:
              - { label: İsim, name: name, widget: string }
              - { label: Yorum, name: text, widget: text }
          - label: Menü Bağlantıları
            name: menu
            widget: list
            fields:
              - { label: Etiket, name: label, widget: string }
              - { label: Adres, name: url, widget: string }

  - name: menu
    label: Menü (Kategoriler ve Ürünler)
    folder: content/menu
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Kategori Adı, name: title, widget: string }
      - { label: Sıra (1 en üstte), name: order, widget: number, value_type: int, default: 1 }
      - { label: Kategori Notu, name: note, widget: string, required: false }
      - label: Ürünler
        name: items
        widget: list
        fields:
          - { label: Ürün Adı, name: name, widget: string }
          - { label: Açıklama, name: description, widget: string, required: false }
          - { label: Fiyat, name: price, widget: string, hint: "Örn. 95 ₺" }
          - { label: Etiketler, name: tags, widget: select, multiple: true, required: false, options: [{ label: Vegan, value: vegan }, { label: Glutensiz, value: glutensiz }, { label: Yeni, value: yeni }, { label: Soğuk, value: soguk }, { label: Sıcak, value: sicak }, { label: Şekersiz, value: sekersiz }] }
          - { label: Ana Sayfada Öne Çıkar, name: popular, widget: boolean, default: false }
          - { label: Görsel, name: image, widget: image, required: false }

  - name: pages
    label: Sayfalar
    folder: content/pages
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Başlık, name: title, widget: string }
      - { label: Giriş Metni, name: body, widget: text, required: false, hint: "Paragraflar boş satırla ayrılır." }
      - label: Resimli Bölümler (başlık + resim + metin)
        name: sections
        widget: list
        required: false
        fields:
          - { label: Başlık, name: title, widget: string }
          - { label: Resim, name: image, widget: image, required: false }
          - { label: Metin, name: text, widget: text }

  - name: events
    label: Etkinlikler (Takvim)
    folder: content/events
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Başlık, name: title, widget: string }
      - { label: Tarih, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Saat, name: time, widget: string, required: false, hint: "Örn. 19:00 - 21:00" }
      - { label: Simge (emoji), name: icon, widget: string, required: false, hint: "Takvimde günün üstünde görünür, örn. 🎨" }
      - { label: Simge Resmi (isteğe bağlı), name: icon_image, widget: image, required: false }
      - { label: Etkinlik Görseli, name: image, widget: image, required: false }
      - { label: Açıklama, name: description, widget: text }
      - { label: Yayında, name: active, widget: boolean, default: true }
